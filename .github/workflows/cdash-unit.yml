name: cdash-unit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    paths:
      - "cmake/**"
      - ".github/workflows/cdash-unit.yml"

concurrency:
  group: cdash-unit-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_SUBMIT_URL: ${{ vars.CTEST_SUBMIT_URL }}

jobs:
  prototype:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [unit, unit-nowallet, unit-asan, unit-gcc]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: bitcoin/bitcoin
          path: bitcoin
          fetch-depth: 0

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build g++ clang \
            pkg-config python3 \
            libevent-dev libboost-dev libsqlite3-dev libzmq3-dev \
            capnproto libcapnp-dev

      - name: Run dashboard
        run: |
          BITCOIN_SOURCE_DIR="$PWD/bitcoin" \
            ctest -S "$PWD/cmake/cdash_unit.cmake" -V \
            -DCDASH_PROFILE=${{ matrix.profile }} \
            -DCDASH_MODEL=${{ github.event_name == 'schedule' && 'Nightly' || 'Experimental' }} \
            -DCDASH_SUBMIT=ON \
            -DCTEST_SUBMIT_URL="$CTEST_SUBMIT_URL"

  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: BrandonOdiwuor/bitcoin
          ref: cmake-ctest-fixes
          path: bitcoin
          fetch-depth: 0

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang \
            pkg-config python3 python3-zmq \
            libevent-dev libboost-dev libsqlite3-dev libzmq3-dev \
            capnproto libcapnp-dev

      - name: Previous-release binaries
        run: python3 test/get_previous_releases.py -t "$PWD/releases"
        working-directory: bitcoin

      - name: Run dashboard
        env:
          PREVIOUS_RELEASES_DIR: ${{ github.workspace }}/bitcoin/releases
        run: |
          BITCOIN_SOURCE_DIR="$PWD/bitcoin" \
            ctest -S "$PWD/cmake/cdash_unit.cmake" -V \
            -DCDASH_PROFILE=functional \
            -DCDASH_MODEL=${{ github.event_name == 'schedule' && 'Nightly' || 'Experimental' }} \
            -DCDASH_SUBMIT=ON \
            -DCTEST_SUBMIT_URL="$CTEST_SUBMIT_URL"